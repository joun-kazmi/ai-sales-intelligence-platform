# Infrastructure lists for extract (signals-scoring.md section 1, D24).
# The extractor records sha256 of this file as the blocklist version in every manifest.
# Seeded from DATA_NOTES 4 and data/sample/entity_probe*.json; grow it from measured data only.

# Records from these modules carry no usable signal (DATA_NOTES 3).
noise_modules = ["nodata-tcp", "x11", "language-server-protocol", "ike"]

# Shared CDN / WAF edge: the `cdn` tag, or org/isp matching one of these (case-insensitive regex).
