[project]
name = "salesintel"
version = "0.1.0"
description = "Sales intelligence for a cybersecurity vendor, built on a Shodan banner dump"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/salesintel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
