[project]
name = "salesintel"
version = "0.1.0"
description = "Sales intelligence for a cybersecurity vendor, built on a Shodan banner dump"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "httpx>=0.27",
    "duckdb>=1.1",
    "jinja2>=3.1",
]

[project.optional-dependencies]
pipeline = [
    "zstandard>=0.23",
    "orjson>=3.10",
    "pyarrow>=17",
    "tldextract>=5.1",
]

[project.scripts]
salesintel-extract = "salesintel.pipeline.extract:main"
salesintel-sample = "salesintel.pipeline.sample:main"
salesintel-score = "salesintel.pipeline.score:main"
salesintel-labelpool = "salesintel.eval.labelpool:main"
salesintel-dnscheck = "salesintel.eval.dnscheck:main"
salesintel-sensitivity = "salesintel.eval.sensitivity:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/salesintel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
